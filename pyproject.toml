[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "py-aliexpress-affiliate"
dynamic = ["version"]
description = "Production-quality, fully typed synchronous and asynchronous Python client for the AliExpress Affiliate (AE Affiliate) API."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Mohammed BADI", email = "badimohammed2019@gmail.com" },
]
keywords = [
    "aliexpress",
    "affiliate",
    "api",
    "sdk",
    "httpx",
    "pydantic",
    "async",
    "ecommerce",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/mouh2020/py-aliexpress-affiliate"
Documentation = "https://github.com/mouh2020/py-aliexpress-affiliate#readme"
Repository = "https://github.com/mouh2020/py-aliexpress-affiliate.git"
Issues = "https://github.com/mouh2020/py-aliexpress-affiliate/issues"
Changelog = "https://github.com/mouh2020/py-aliexpress-affiliate/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/aliexpress_affiliate/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/aliexpress_affiliate",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aliexpress_affiliate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "live: live integration tests against the real AliExpress Affiliate API (skipped by default; pass --run-live to execute)",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
    "UP007", # keep Optional/Union for clear Python 3.9 runtime compatibility in Pydantic
    "UP031", # preserve exact percent-format signing logic from python-aliexpress-api
    "UP045", # keep Optional[X] syntax for Python 3.9 compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["aliexpress_affiliate"]
